name: Release APK

# Builds the APK and attaches it to a GitHub release.
#  - Runs automatically when you publish a release on github.com.
#  - Or run it by hand (Actions › Release APK › Run workflow) for a release that already exists.
# The app's version name comes from the tag (v1.2 → 1.2).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the APK to (e.g. v1.2)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionName="${TAG#v}"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="PrayerAlerts-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber
