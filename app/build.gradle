plugins {
    id 'com.android.application'
}

// Version code goes up by itself on every build (minutes since 1 Jan 2026), so any new
// build — Android Studio, a push, or a release — always installs over the previous one.
def autoVersionCode = ((System.currentTimeMillis().intdiv(1000L) - 1767225600L).intdiv(60L)) as int
// Version name comes from the release tag (-PappVersionName=1.2); local/test builds use the default.
def appVersionName = project.findProperty('appVersionName') ?: '1.1'

android {
    namespace 'com.asif.prayeralerts'
    compileSdk 34

    defaultConfig {
        applicationId "com.asif.prayeralerts"
        minSdk 26
        targetSdk 34
        versionCode autoVersionCode
        versionName appVersionName
    }

    // Same key on every machine (Android Studio or GitHub), so new versions install over old ones.
    signingConfigs {
        debug {
            storeFile file('prayeralerts-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the same included key, so release and test builds update each other.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    // On-device text recognition (model bundled in the APK, works offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
