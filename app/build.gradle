plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asif.prayeralerts'
    compileSdk 34

    defaultConfig {
        applicationId "com.asif.prayeralerts"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Same key on every machine (Android Studio or GitHub), so new versions install over old ones.
    signingConfigs {
        debug {
            storeFile file('prayeralerts-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    // On-device text recognition (model bundled in the APK, works offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
